# Keyword patterns for the spring_boot_2_to_3 profile.

[source_keywords]
R01 = ["javax.persistence", "javax.validation", "javax.servlet", "javax.annotation", "javax.transaction"]
R02 = ["authorizerequests()", "antmatchers(", "http.csrf(", "http.cors("]
R03 = ["extends websecurityconfigureradapter", "websecurityconfigureradapter"]
R04 = ["@enableglobalmethodsecurity"]
R05 = ["findbyid("]
R06 = ["initialization-mode"]
R07 = ["use-suffix-pattern", "use-registered-suffix-pattern"]
R08 = ["management.endpoints.web.exposure"]
R09 = ["@constructorbinding"]
R10 = ["antmatchers(", "mvcmatchers("]
R11 = ["new resttemplate(", "resttemplate resttemplate"]
R12 = ["application_json_utf8", "stringutils.isempty("]
R13 = ["@sequencegenerator", "sequencegenerator"]
R14 = ["jobbuilderfactory", "stepbuilderfactory"]
R15 = ["net.sf.ehcache", "ehcache.xml"]

[import_keywords]
R01 = ["javax.persistence", "javax.validation", "javax.servlet", "javax.annotation", "javax.transaction"]
R02 = ["org.springframework.security.config.annotation.web"]
R03 = ["org.springframework.security.config.annotation.web.configuration.websecurityconfigureradapter"]
R04 = ["org.springframework.security.config.annotation.method.configuration.enableglobalmethodsecurity"]
R05 = ["org.springframework.data.repository"]
R09 = ["org.springframework.boot.context.properties.constructorbinding"]
R11 = ["org.springframework.web.client.resttemplate"]
R12 = ["org.springframework.http.mediatype", "org.springframework.util.stringutils"]
R13 = ["javax.persistence.sequencegenerator"]
R14 = ["org.springframework.batch.core.configuration.annotation.jobbuilderfactory",
       "org.springframework.batch.core.configuration.annotation.stepbuilderfactory"]
R15 = ["net.sf.ehcache"]
