[project]
name = "code-migration-agent"
version = "0.1.0"
description = "LLM-powered code migration platform: point at a repo + profile, get a green PR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # orchestration
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    # model access
    "anthropic>=0.40.0",
    # code parsing (Phase 1)
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-kotlin>=0.3.0",
    # git / github
    "gitpython>=3.1.50",
    "PyGithub>=2.5.0",
    # sandbox runtime
    "docker>=7.0.0",
    # tracing
    "langfuse>=4.7.1",
    # http
    "httpx>=0.28.1",
    # sandbox runtime (Phase 3)
    "e2b>=1.0.0",
    # Phase 5+ (embeddings / pgvector) — NOT in v1; kept for future reference
    # "voyageai>=0.3.7",
    # "psycopg2-binary>=2.9.12",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core", "src/migration"]
